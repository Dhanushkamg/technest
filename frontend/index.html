<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TechNest — Premium electronics, laptops, smartphones, audio gear, and next-generation tech gadgets." />
    <meta name="keywords" content="electronics, computers, smartphones, audio, gadgets, ecommerce, tech" />
    <meta name="theme-color" content="#4f46e5" />
    <title>TechNest — Next-Gen Electronics & Tech Marketplace</title>

    <!-- OpenGraph Metadata -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TechNest" />
    <meta property="og:title" content="TechNest — Next-Gen Electronics & Tech Marketplace" />
    <meta property="og:description" content="Premium electronics, laptops, smartphones, audio gear, and next-generation tech gadgets." />
    <meta property="og:image" content="/favicon.svg" />

    <!-- Twitter Card Metadata -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TechNest — Next-Gen Electronics & Tech Marketplace" />
    <meta name="twitter:description" content="Premium electronics, laptops, smartphones, audio gear, and next-generation tech gadgets." />
    <meta name="twitter:image" content="/favicon.svg" />

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Immediate Theme Anti-Flash Script -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('technest_theme') || 'system';
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = saved === 'dark' || (saved === 'system' && prefersDark);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen antialiased transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
