spring.application.name=backend
spring.config.import=optional:file:.env[.properties]

# ---------------------------------------------------------------------------
# Database Configuration
# ---------------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ecommerce_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres123}

# Flyway Database Migration Strategy
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

# JPA / Hibernate: Production uses validate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ---------------------------------------------------------------------------
# JWT Configuration
# ---------------------------------------------------------------------------
jwt.secret=${JWT_SECRET:MySuperSecretKeyForEcommerceApplication2026ThisMustBeLongEnough}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ---------------------------------------------------------------------------
# CORS Configuration
# ---------------------------------------------------------------------------
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ---------------------------------------------------------------------------
# PayHere Configuration
# ---------------------------------------------------------------------------
payhere.merchant-id=${PAYHERE_MERCHANT_ID:1236634}
payhere.merchant-secret=${PAYHERE_MERCHANT_SECRET}
payhere.sandbox=${PAYHERE_SANDBOX:true}
payhere.currency=${PAYHERE_CURRENCY:LKR}
payhere.return-url=${PAYHERE_RETURN_URL:http://localhost:5173/order-success}
payhere.cancel-url=${PAYHERE_CANCEL_URL:http://localhost:5173/checkout}
payhere.notify-url=${PAYHERE_NOTIFY_URL}

# ---------------------------------------------------------------------------
# Actuator / Observability Configuration
# Only expose health and info endpoints publicly without leaking internal details
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.info.env.enabled=false

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging.level.com.technest.backend.exception.GlobalExceptionHandler=ERROR
logging.level.com.technest.backend=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN