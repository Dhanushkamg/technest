spring.application.name=backend
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:5432/ecommerce_db
spring.datasource.username=postgres
spring.datasource.password=postgres123

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=MySuperSecretKeyForEcommerceApplication2026ThisMustBeLongEnough
jwt.expiration=86400000

# ---------------------------------------------------------------------------
# PayHere Configuration
# All values must be supplied via environment variables.
# See backend/.env.example for the full list.
#
# PAYHERE_MERCHANT_SECRET must NEVER have a fallback value here.
# The application will refuse to start if this variable is not set.
#
# PAYHERE_NOTIFY_URL must be a publicly reachable URL.
# For local development, use an ngrok/cloudflared tunnel:
#   ngrok http 8080
# then set PAYHERE_NOTIFY_URL=https://<your-tunnel>.ngrok-free.app/api/payments/payhere/notify
# ---------------------------------------------------------------------------
payhere.merchant-id=${PAYHERE_MERCHANT_ID:1236634}
payhere.merchant-secret=${PAYHERE_MERCHANT_SECRET}
payhere.sandbox=true
payhere.currency=${PAYHERE_CURRENCY:LKR}
payhere.return-url=${PAYHERE_RETURN_URL:http://localhost:5173/order-success}
payhere.cancel-url=${PAYHERE_CANCEL_URL:http://localhost:5173/checkout}
payhere.notify-url=${PAYHERE_NOTIFY_URL}

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging.level.com.technest.backend.exception.GlobalExceptionHandler=ERROR
logging.level.com.technest.backend=DEBUG
# Ensure PayHere credentials never appear in datasource or SQL logs:
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN